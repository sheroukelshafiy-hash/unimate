<app-navbar></app-navbar>
<div class="chat-box">
  <div class="chat-header">
    <h3>UniMate AI Assistant</h3>
  </div>

  <div class="messages-list">
    <div *ngFor="let msg of messages()" [class]="'msg ' + msg.sender">
      <div class="bubble">
        <p>{{ msg.text }}</p>
        <div *ngIf="msg.sources && msg.sources.length" class="sources">
          <small>المصادر: {{ msg.sources.join(', ') }}</small>
        </div>
      </div>
    </div>
  </div>

  <div class="input-area">
    <input 
      type="text" 
      [ngModel]="userInput()" 
      (ngModelChange)="userInput.set($event)"
      (keyup.enter)="sendMessage()"
      placeholder="اسأل عن اللائحة أو الساعات المعتمدة..." />
    <button (click)="sendMessage()">إرسال</button>
  </div>
</div>
