<div class=" login-page  d-flex justify-content-center align-items-center vh-100">

  <div class="col-md-4 p-4 border rounded shadow login_form">

    <h1 class="text-center mb-4 text-warning-emphasis fs-2 bold">Welcome to the Login Page</h1>

    <form (ngSubmit)="login()" [formGroup]="loginForm">

      <div class="mb-3">
        <label for="email" class="form-label text-warning-emphasis">Email:</label>

        <input
          type="email"
          id="email"
           name="email"
          class="form-control"
          [formControl]="loginForm.controls.email">
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-warning-emphasis">Password:</label>

        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          [formControl]="loginForm.controls.password">
      </div>

      <button type="submit" class="btn btn-dark w-100">
        Login
      </button>
      
     <p class="text-center mt-3 text-warning-emphasis">
        Forgot your password?
       <a routerLink="/forgot-password">Forgot Password</a>
     </p>
     <p class="text-center mt-3 text-warning-emphasis">
        Don't have an account?
       <a routerLink="/register">Register</a>
     </p>

    </form>

  </div>

</div>
